name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main]

jobs:
  db-contract-verification:
    name: DB Contract Verification
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      DATABASE_CREDENTIAL_CLASS: test-owner

    services:
      mysql:
        image: mysql:8.0.44@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: listify_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static database authority gate
        run: pnpm db:authority:check

      - name: Validate migration/schema consistency
        run: pnpm run schema:sanity

      - name: Run isolated database authority security contract
        run: pnpm test:db-authority:static

      - name: Run fresh-schema database consumer contract
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
          LOCAL_DEMO_AGENCY_PASSWORD: ci-local-demo-password
        run: pnpm db:authority:consumer-contract

      - name: Run and capture schema congruency evidence
        if: always()
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
        run: |
          set -o pipefail
          mkdir -p artifacts
          pnpm --silent db:schema:congruency | tee artifacts/database-schema-congruency.json

      - name: Upload schema congruency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-schema-congruency-${{ github.run_id }}
          path: artifacts/database-schema-congruency.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run full database contract verification
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
        run: pnpm db:verify:ci

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    needs: db-contract-verification

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate @ts-nocheck baseline
        run: pnpm run lint:tsnocheck-baseline

      - name: Run ESLint
        run: pnpm run lint:check

      - name: Run TypeScript type check
        run: pnpm run type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: db-contract-verification

    services:
      mysql:
        image: mysql:8.0.44@sha256:9c3380eac945af0736031b200027f581925927c81e010056214a4bd6b6693714
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: listify_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply canonical SQL migrations
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
        run: pnpm db:migrate:test

      - name: Prepare canonical disposable reference data
        env:
          CI: 'true'
          APP_ENV: test
          NODE_ENV: test
          DATABASE_CREDENTIAL_CLASS: test-owner
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
        run: pnpm db:reference:prepare

      - name: Verify canonical disposable reference data
        env:
          CI: 'true'
          APP_ENV: test
          NODE_ENV: test
          DATABASE_CREDENTIAL_CLASS: test-owner
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
        run: pnpm db:reference:verify

      - name: Prepare canonical disposable foundation data
        env:
          CI: 'true'
          APP_ENV: test
          NODE_ENV: test
          DATABASE_CREDENTIAL_CLASS: test-owner
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
        run: pnpm db:foundation:prepare

      - name: Verify canonical disposable foundation data
        env:
          CI: 'true'
          APP_ENV: test
          NODE_ENV: test
          DATABASE_CREDENTIAL_CLASS: test-owner
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
        run: pnpm db:foundation:verify

      - name: Run tests
        env:
          DATABASE_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          mapfile -t CLIENT_TESTS < <(
            find client/src -type f \
              \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
              ! -name '*.visual.test.ts' \
              ! -name '*.visual.test.tsx' \
              | sort
          )
          for test_file in "${CLIENT_TESTS[@]}"; do
            echo "Running client test: ${test_file}"
            pnpm vitest run --project client --minWorkers=1 --maxWorkers=1 --silent "${test_file}"
          done
          pnpm vitest run --project server --minWorkers=1 --maxWorkers=2 --silent

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [db-contract-verification, lint-and-typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
