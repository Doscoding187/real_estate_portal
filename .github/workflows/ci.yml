name: CI Pipeline

on:
  pull_request:
    branches: [main, develop]
  push:
    # Validate the isolated B12 release tree as well as the PR integration tree.
    # This does not deploy or change main's branch-protection requirements.
    branches: [main, fix/b12-readiness-correction-20261008]

jobs:
  db-contract-verification:
    name: DB Contract Verification
    runs-on: ubuntu-latest

    env:
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test

    services:
      mysql:
        image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: listify_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static database authority gate
        run: pnpm db:authority:check
      - name: Verify database lifecycle contract
        run: pnpm db:authority:lifecycle

      - name: Validate migration/schema consistency
        run: pnpm run schema:sanity

      - name: Run isolated database authority security contract
        run: pnpm test:db-authority:static

      - name: Provision isolated CI migration identity
        env:
          DATABASE_URL: ''
          LISTIFY_E2E_DATABASE_URL: ''
          DATABASE_BOOTSTRAP_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
          ISOLATED_CI_BOOTSTRAP_PHASE: migration-only
        run: pnpm db:ci:identities:bootstrap

      - name: Apply fresh canonical migrations
        run: pnpm db:migrate:test

      - name: Provision isolated CI runtime identities
        env:
          DATABASE_URL: ''
          LISTIFY_E2E_DATABASE_URL: ''
          DATABASE_BOOTSTRAP_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
          ISOLATED_CI_BOOTSTRAP_PHASE: full
        run: pnpm db:ci:identities:bootstrap

      - name: Run fresh-schema database consumer contract
        env:
          LOCAL_DEMO_AGENCY_PASSWORD: ci-local-demo-password
          DATABASE_CONSUMER_CONTRACT_PHASE: post-migration
        run: |
          test -n "${DATABASE_MIGRATION_URL:-}"
          export DATABASE_URL="${DATABASE_MIGRATION_URL}"
          set -o pipefail
          mkdir -p artifacts
          started_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          service_id=$(docker ps --filter name=mysql --format '{{.ID}}' | head -n 1)
          docker ps --filter name=mysql > artifacts/mysql-service-status.txt 2>&1 || true
          set +e
          pnpm db:authority:consumer-contract \
            > >(tee artifacts/consumer-contract.stdout) \
            2> >(tee artifacts/consumer-contract.stderr >&2)
          exit_status=$?
          set -e
          finished_at=$(date -u +%Y-%m-%dT%H:%M:%S.%3NZ)
          if [ -n "${service_id}" ]; then
            docker logs "${service_id}" > artifacts/mysql-service.log 2>&1 || true
          fi
          stdout_sha=$(sha256sum artifacts/consumer-contract.stdout | cut -d ' ' -f 1)
          stderr_sha=$(sha256sum artifacts/consumer-contract.stderr | cut -d ' ' -f 1)
          service_status_sha=$(sha256sum artifacts/mysql-service-status.txt | cut -d ' ' -f 1)
          service_log_sha=$(sha256sum artifacts/mysql-service.log 2>/dev/null | cut -d ' ' -f 1 || true)
          printf '{"startedAt":"%s","finishedAt":"%s","exitStatus":%s,"stdoutSha256":"%s","stderrSha256":"%s","serviceStatusSha256":"%s","serviceLogSha256":"%s"}\n' \
            "${started_at}" "${finished_at}" "${exit_status}" "${stdout_sha}" "${stderr_sha}" "${service_status_sha}" "${service_log_sha}" \
            > artifacts/consumer-contract-observability.json
          rm -f artifacts/consumer-contract.stdout artifacts/consumer-contract.stderr artifacts/mysql-service-status.txt artifacts/mysql-service.log
          exit "${exit_status}"

      - name: Verify physical CI credential boundaries
        run: |
          test -n "${DATABASE_VERIFIER_URL:-}"
          export DATABASE_URL="${DATABASE_VERIFIER_URL}"
          set -o pipefail
          mkdir -p artifacts
          pnpm db:ci:identities:verify | tee artifacts/credential-boundary.json

      - name: Upload credential boundary evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-credential-boundary-${{ github.run_id }}
          path: artifacts/credential-boundary.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run and capture schema congruency evidence
        if: always()
        run: |
          test -n "${DATABASE_VERIFIER_URL:-}"
          export DATABASE_URL="${DATABASE_VERIFIER_URL}"
          set -o pipefail
          mkdir -p artifacts
          pnpm --silent db:schema:congruency | tee artifacts/database-schema-congruency.json

      - name: Upload schema congruency evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-schema-congruency-${{ github.run_id }}
          path: artifacts/database-schema-congruency.json
          if-no-files-found: warn
          retention-days: 7

      - name: Upload sanitized consumer execution evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: database-consumer-observability-${{ github.run_id }}
          path: artifacts/consumer-contract-observability.json
          if-no-files-found: warn
          retention-days: 7

      - name: Run full database contract verification
        run: |
          test -n "${DATABASE_VERIFIER_URL:-}"
          export DATABASE_URL="${DATABASE_VERIFIER_URL}"
          pnpm db:verify:ci

      - name: Run isolated CHECK/FK and lifecycle tests
        env:
          S2_DB_TESTS: '1'
        run: pnpm test:authority -- server/__tests__/integration.developer-engine-s2-supersession.test.ts server/__tests__/integration.billing-billable-account.test.ts --reporter=basic

  place-authority:
    name: Canonical Place Authority
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Rebuild and check admitted Place packages
        run: pnpm place:admission:check

      - name: Check admitted Place boundary provenance
        run: pnpm place:boundary-currency:check

      - name: Verify national Place package neutrality
        run: pnpm place:admission:territory-neutrality

      - name: Check canonical Place URL projection
        run: pnpm place:urls:check

  lint-and-typecheck:
    name: Lint & TypeCheck
    runs-on: ubuntu-latest
    needs: db-contract-verification

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate @ts-nocheck baseline
        run: pnpm run lint:tsnocheck-baseline

      - name: Run ESLint
        run: pnpm run lint:check

      - name: Run TypeScript type check
        run: pnpm run type-check

  test:
    name: Unit & Integration Tests
    runs-on: ubuntu-latest
    needs: db-contract-verification

    env:
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      # Synthetic signing key for production-mode session rejection tests.
      JWT_SECRET: ci-disposable-session-signing-key-not-for-production

    services:
      mysql:
        image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: listify_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify isolated storage permission contracts
        run: |
          node --test scripts/storage/tests/proof-runtime-verify.test.cjs scripts/storage/tests/media-runtime-verify.test.cjs
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s scripts/storage/tests -p 'test_*.py'

      - name: Provision isolated CI migration identity
        env:
          DATABASE_URL: ''
          LISTIFY_E2E_DATABASE_URL: ''
          DATABASE_BOOTSTRAP_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
          ISOLATED_CI_BOOTSTRAP_PHASE: migration-only
        run: pnpm db:ci:identities:bootstrap

      - name: Apply fresh canonical migrations
        run: pnpm db:migrate:test

      - name: Provision isolated CI runtime identities
        env:
          DATABASE_URL: ''
          LISTIFY_E2E_DATABASE_URL: ''
          DATABASE_BOOTSTRAP_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
          ISOLATED_CI_BOOTSTRAP_PHASE: full
        run: pnpm db:ci:identities:bootstrap

      # The last-super-admin contract requires an empty user table. Run all
      # five role/session/audit cases before the scenario adds its reviewer.
      - name: Verify role and session authority before reviewer fixtures
        run: pnpm test:authority -- --project server --minWorkers=1 --maxWorkers=1 --no-file-parallelism server/__tests__/integration.b07-role-session-audit.test.ts

      - name: Verify founder identity authority before reviewer fixtures
        env:
          SKIP_DB_INIT: '1'
        run: pnpm test:authority -- --project server --minWorkers=1 --maxWorkers=1 --no-file-parallelism server/__tests__/integration.founder-google-identity.test.ts

      # All admitted Place territories are the single geography reference data lane.
      # OSM-only assertions remain disposable-only; this is not a production release.
      - name: Prepare admitted Place integration fixtures
        run: pnpm db:places:prepare-national

      - name: Verify admitted Place integration fixtures
        run: pnpm db:places:verify-national

      - name: Probe canonical Place admission on the disposable target
        run: pnpm place:admission:probe

      - name: Require dependent admitted Place identities
        run: pnpm vitest run --project server --minWorkers=1 --maxWorkers=1 server/__tests__/contract.place-executable-foundation.test.ts -t 'requires the admitted Place fixture identities'

      - name: Prepare canonical disposable foundation data
        run: pnpm db:foundation:prepare

      - name: Verify canonical disposable foundation data
        run: pnpm db:foundation:verify

      - name: Prepare canonical disposable scenario data
        env:
          LOCAL_DEMO_AGENCY_PASSWORD: ci-local-demo-password
        run: pnpm db:scenario:prepare

      - name: Verify canonical disposable scenario data
        run: pnpm db:scenario:verify

      - name: Run tests
        env:
          NODE_OPTIONS: --max-old-space-size=12288
        run: |
          pnpm vitest run --project place-command --minWorkers=1 --maxWorkers=1
          mapfile -t CLIENT_TESTS < <(
            find client/src -type f \
              \( -name '*.test.ts' -o -name '*.test.tsx' -o -name '*.spec.ts' -o -name '*.spec.tsx' \) \
              ! -name '*.visual.test.ts' \
              ! -name '*.visual.test.tsx' \
              | sort
          )
          for test_file in "${CLIENT_TESTS[@]}"; do
            echo "Running client test: ${test_file}"
            pnpm vitest run --project client --minWorkers=1 --maxWorkers=1 --silent "${test_file}"
          done
          # Already exercised on the fresh unseeded target above; never delete
          # or demote the canonical reviewer to satisfy a sole-admin fixture.
          # Vitest 2 workspace projects do not inherit the CLI --exclude
          # option. Select from its configured inventory explicitly instead.
          mapfile -t SERVER_TESTS < <(
            pnpm vitest list --project server --filesOnly \
              | sed -n 's/^\[server\] //p' \
              | awk '$0 != "server/__tests__/integration.b07-role-session-audit.test.ts" && $0 != "server/__tests__/integration.founder-google-identity.test.ts"'
          )
          test "${#SERVER_TESTS[@]}" -gt 0
          pnpm vitest run --project server --minWorkers=1 --maxWorkers=1 --silent "${SERVER_TESTS[@]}"

  journey-surface:
    name: Geography Journey Surface
    runs-on: ubuntu-latest

    outputs:
      changed: ${{ steps.surface.outputs.changed }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The geography journey is a gate for the geography surface, not for every change on the
      # platform. This decides whether the journey is in scope, so a change that cannot affect it
      # neither spends the time nor blocks anything.
      - name: Detect the geography journey surface
        id: surface
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          else
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          fi
          changed=$(git diff --name-only "$base" "$head" 2>/dev/null || true)
          if printf '%s\n' "$changed" | grep -qE '^(e2e/|playwright\.config\.ts$|\.github/workflows/ci\.yml$|client/src/(pages/|components/(search|city-guide|location|EnhancedHero|HomeAreaPicker)|lib/(location|search|cityGuide|heroJourney|homeArea))|server/(placeAuthorityRouter\.ts|locationRouter\.ts|_core/vite\.ts|services/(location|nationalPlace|publicSearch|searchDiscovery|canonicalPlace))|shared/(locationAuthority|canonicalPlaceUrlProjection|searchDiscovery|searchScope|placeAuthority)\.ts|drizzle/schema/(placeAuthority|locations)\.ts|data/(geography-coverage|gauteng-place-admission|place-admission-territories|place-url-projection)|tools/place-admission/|scripts/measure-city-scope-members)'; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
          fi

  browser-journey:
    name: Browser Journey (geography)
    runs-on: ubuntu-latest
    needs: [db-contract-verification, journey-surface]
    # The journey is a gate for the geography surface. A change that cannot affect it skips the
    # journey, so it never blocks an unrelated change and never costs it the runner time.
    if: needs.journey-surface.outputs.changed == 'true'

    env:
      CI: 'true'
      APP_ENV: test
      NODE_ENV: test
      JWT_SECRET: ci-disposable-session-signing-key-not-for-production
      APP_URL: http://localhost:5000
      FRONTEND_URL: http://localhost:5000
      VITE_API_URL: http://localhost:5000
      VITE_API_BASE_URL: http://localhost:5000

    services:
      mysql:
        image: mysql:8.4.7@sha256:0426ec38c7a10aa45ba383887df7878f74ee70e2fd589c7b69207f3577901903
        env:
          MYSQL_ROOT_PASSWORD: test_password
          MYSQL_DATABASE: listify_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=8

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser journey runs against the real application, so the browser
      # has to exist on the runner. Chromium only: the other engines stay a
      # local concern, and the geography journey is engine-independent.
      - name: Install the browser
        run: pnpm exec playwright install --with-deps chromium

      # The journey runs the application as a test runtime, which serves the
      # built client rather than the development server. The client is built
      # here so the journey exercises the same bundle the deployment serves.
      - name: Build the client
        run: pnpm build:frontend

      - name: Provision isolated CI migration identity
        env:
          DATABASE_URL: ''
          LISTIFY_E2E_DATABASE_URL: ''
          DATABASE_BOOTSTRAP_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
          ISOLATED_CI_BOOTSTRAP_PHASE: migration-only
        run: pnpm db:ci:identities:bootstrap

      - name: Apply fresh canonical migrations
        run: pnpm db:migrate:test

      - name: Provision isolated CI runtime identities
        env:
          DATABASE_URL: ''
          LISTIFY_E2E_DATABASE_URL: ''
          DATABASE_BOOTSTRAP_URL: mysql://root:test_password@127.0.0.1:3306/listify_test
          ISOLATED_CI_BOOTSTRAP_PHASE: full
        run: pnpm db:ci:identities:bootstrap

      # All admitted Place territories are the single geography reference data lane.
      # OSM-only assertions remain disposable-only; this is not a production release.
      - name: Prepare admitted Place integration fixtures
        run: pnpm db:places:prepare-national

      - name: Verify admitted Place integration fixtures
        run: pnpm db:places:verify-national

      - name: Prepare canonical disposable foundation data
        run: pnpm db:foundation:prepare

      - name: Verify canonical disposable foundation data
        run: pnpm db:foundation:verify

      - name: Prepare canonical disposable scenario data
        env:
          LOCAL_DEMO_AGENCY_PASSWORD: ci-local-demo-password
        run: pnpm db:scenario:prepare

      - name: Verify canonical disposable scenario data
        run: pnpm db:scenario:verify

      # The route journey resolves each canonical URL through Place Authority
      # after the admitted package fixtures are loaded. It also proves retired
      # SRP geography paths stay retired.
      - name: Run the geography journey
        env:
          # An isolated CI database only resolves its target class in the test
          # runtime, so the application starts as a test runtime here.
          PLAYWRIGHT_SERVER_NODE_ENV: test
          PLAYWRIGHT_SERVER_APP_ENV: test
        run: >
          pnpm exec playwright test
          e2e/routing/neutral-geography-routing.spec.ts
          --project="Desktop Chrome"
          --reporter=line

  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: [db-contract-verification, lint-and-typecheck]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build application
        run: pnpm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: dist/
          retention-days: 7
