services:
  mysql-authority-3307:
    image: mysql:8.0
    container_name: listify-mysql-authority-3307
    restart: 'no'
    environment:
      MYSQL_ALLOW_EMPTY_PASSWORD: 'yes'
    ports:
      - '127.0.0.1:3307:3306'
    volumes:
      - listify_mysql_authority_3307_data:/var/lib/mysql
    command: --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ['CMD-SHELL', 'mysqladmin ping -h 127.0.0.1 -uroot --skip-password --silent']
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

volumes:
  listify_mysql_authority_3307_data:
